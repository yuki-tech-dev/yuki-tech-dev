<svg viewBox="0 0 800 120" width="100%" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="eq-bar-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#330000" />
      <stop offset="60%" stop-color="#cc0011" />
      <stop offset="90%" stop-color="#ff3344" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;display=swap');
      .linkin-park-style { font-family: 'Archivo Black', sans-serif; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="800" height="120" fill="#070707" />
  
  <g fill="url(#eq-bar-grad)" opacity="0.5">
    <rect x="20" width="20" height="120"><animate attributeName="y" dur="4.8s" repeatCount="indefinite" values="20; 80; 40; 100; 20" /></rect>
    <rect x="50" width="20" height="120"><animate attributeName="y" dur="3.6s" repeatCount="indefinite" values="70; 10; 60; 30; 70" /></rect>
    <rect x="80" width="20" height="120"><animate attributeName="y" dur="4.2s" repeatCount="indefinite" values="30; 100; 15; 80; 30" /></rect>
    <rect x="110" width="20" height="120"><animate attributeName="y" dur="3.2s" repeatCount="indefinite" values="90; 30; 100; 10; 90" /></rect>
    <rect x="140" width="20" height="120"><animate attributeName="y" dur="5.0s" repeatCount="indefinite" values="50; 100; 25; 70; 50" /></rect>
  </g>

  <rect width="800" height="120" fill="#000000" opacity="0.3" />

  <g transform="translate(400, 65)" text-anchor="middle">
    <text y="0" class="linkin-park-style" font-size="40" fill="#ffffff" letter-spacing="10">GATTSU</text>
    <text y="30" class="linkin-park-style" font-size="14" fill="#aaaaaa" letter-spacing="12">SYSTEM ARCHITECT</text>
  </g>
</svg>
