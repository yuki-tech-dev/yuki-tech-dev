<svg width="100%" height="150" viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <linearGradient id="eq-bar-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#330000" />
      <stop offset="60%" stop-color="#cc0011" />
      <stop offset="90%" stop-color="#ff3344" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;display=swap');
      .linkin-park-style {
        font-family: 'Archivo Black', sans-serif;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <rect width="100%" height="150" fill="#070707" />

  <g fill="url(#eq-bar-grad)" opacity="0.5">
    <rect x="20" width="24" height="150">
      <animate attributeName="y" dur="4.8s" repeatCount="indefinite" values="20; 120; 50; 130; 20" />
    </rect>
    <rect x="50" width="24" height="150">
      <animate attributeName="y" dur="3.6s" repeatCount="indefinite" values="90; 15; 70; 40; 90" />
    </rect>
    <rect x="80" width="24" height="150">
      <animate attributeName="y" dur="4.2s" repeatCount="indefinite" values="40; 130; 20; 100; 40" />
    </rect>
    <rect x="110" width="24" height="150">
      <animate attributeName="y" dur="3.2s" repeatCount="indefinite" values="110; 40; 120; 15; 110" />
    </rect>
    <rect x="140" width="24" height="150">
      <animate attributeName="y" dur="5.0s" repeatCount="indefinite" values="60; 120; 35; 90; 60" />
    </rect>
  </g>

  <rect width="100%" height="150" fill="#000000" opacity="0.3" />

  <g transform="translate(500, 80)" text-anchor="middle">
    <text y="0" class="linkin-park-style" font-size="48" fill="#ffffff" letter-spacing="12">GATTSU</text>
    <text y="35" class="linkin-park-style" font-size="16" fill="#888888" letter-spacing="16">SYSTEM ARCHITECT</text>
  </g>
</svg>
